<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إلى ندائي 💕 | 13/8/2024</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root { --primary: #ff4d6d; --secondary: #c77dff; --gold: #ffb703; --bg-dark: #0b091a; }
    body { background-color: var(--bg-dark); color: #f8f9fa; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
    .container { width: 90%; max-width: 680px; background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); padding: 30px; border-radius: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .step { display: none; } .active { display: block; }
    .title-glow { font-family: 'Amiri', serif; font-size: 2rem; color: #fff; text-shadow: 0 0 10px var(--primary); }
    .btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 12px 30px; border-radius: 50px; cursor: pointer; border: none; margin-top: 20px; }
    .song-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; margin: 20px 0; border: 1px solid var(--gold); }
    audio { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="step active" id="step-1">
    <h1 class="title-glow">إلى نِداء قلبي.. 💕</h1>
    <button class="btn" onclick="start()">ابدأ الحكاية ✨</button>
  </div>

  <div class="step" id="step-2">
    <div id="contentArea"></div>
    <div style="margin-top:20px;">
      <button class="btn" onclick="next()">التالي 🌸</button>
    </div>
  </div>
</div>

<script>
  // الأغاني بملفات مباشرة
  const songs = [
    { title: "الأغنية الأولى", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", text: "هذه اغنيتنا الأولى أو اعتبرها اغنيتي الأولى معك، لأنني وبمجرد سماعها لا أستطيع التفكير الا بك فقط." },
    { title: "أنت مامثلك عيون", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", text: "هو في مثلك؟ أنت مامثلك عيون" },
    { title: "باختياري", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", text: "باختياري قلبي حبك باختيااااااري" },
    { title: "يا بعد المسافة", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", text: "قصري بعد المسافة لا تطول وارحمي قلب يعذبه الحنين." },
    { title: "تصدقي وإلا احلفلك", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", text: "تصدقي وإلا احلفلك اني احبك طيب؟!!!" },
    { title: "يا عيونك", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", text: "عيوووووووونك يااااااااااااااعيونك ياللي هي آخر امالي والله" },
    { title: "عيونك لا توريها", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", text: "عيونك لا توريها ل غيري لا توريها!" }
  ];

  let step = 0;
  function start() { document.getElementById('step-1').style.display = 'none'; document.getElementById('step-2').style.display = 'block'; showContent(); }
  
  function showContent() {
    const area = document.getElementById('contentArea');
    if (step < songs.length) {
      area.innerHTML = `<div class="song-card"><h3>${songs[step].title}</h3><p>${songs[step].text}</p><audio controls src="${songs[step].url}"></audio></div>`;
    } else {
      area.innerHTML = `<p style="line-height:2; font-size:1.2rem;">هذه نبذه وغيض من فيض ومن بحر الأغاني التي تذكرني بك، هنالك الكثير والكثير ولكن احببت ان انتقي لك بعض منها فقط، احبك ندائي.🤍</p>`;
    }
  }

  function next() { step++; if (step > songs.length) location.reload(); showContent(); }
</script>
</body>
</html>
